name: Apify Dunnes Scraper

on:
  schedule:
    # Aligned with other stores on Mon + Thu (was Tue + Fri) — 2026-04-18.
    # Minute 23, not 00: on-the-hour crons started 4–11 h late in Aug 2026.
    # Both runs use PENDING mode (see the run step), so the mode no longer
    # depends on the start hour.
    - cron: '23 6 * * 1,4'  # Mon + Thu — first pass
    - cron: '23 8 * * 1,4'  # Mon + Thu — second pass over what is still pending
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max products to scrape (empty = no limit)'
        required: false
        default: ''
      dry_run:
        description: 'Run without uploading prices'
        required: false
        type: boolean
        default: false
      all_products:
        description: 'Scrape ALL products (not just pending)'
        required: false
        type: boolean
        default: false
      use_residential_proxy:
        description: 'Use residential proxy (required for Cloudflare bypass)'
        required: false
        type: boolean
        default: true

jobs:
  scrape-dunnes:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 4 batches × 25 min + upload + startup overhead

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install apify-client requests

      - name: Run Apify Dunnes Scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_DUNNES_ACTOR_ID: ${{ secrets.APIFY_DUNNES_ACTOR_ID }}
          API_URL: ${{ secrets.API_URL }}
          SCRAPER_USERNAME: ${{ secrets.SCRAPER_USERNAME }}
          SCRAPER_PASSWORD: ${{ secrets.SCRAPER_PASSWORD }}
          SCRAPER_COUNTRY: 'IE'
          SCRAPER_CURRENCY: 'EUR'
          # Per-run alias cap (API max 1000). Both daily runs hit 500 on
          # 2026-09-03, so part of the catalogue is never scraped; raise via the
          # DUNNES_MAX_ALIASES repo variable once the Apify budget allows.
          DUNNES_MAX_ALIASES: ${{ vars.DUNNES_MAX_ALIASES || '500' }}
          # Apify guards (apify_guards.py): abort below this remaining credit,
          # flag a run partial below this coverage.
          APIFY_MIN_REMAINING_USD: ${{ vars.APIFY_MIN_REMAINING_USD || '0.75' }}
          APIFY_MIN_RESULT_PCT: ${{ vars.APIFY_MIN_RESULT_PCT || '90' }}
        run: |
          ARGS=""

          # Scheduled runs always use PENDING mode. With a per-run alias cap,
          # ALL mode re-fetches the same first N aliases every time, while
          # pending mode rotates through everything not yet scraped today —
          # so the 06:23 and 08:23 runs cover different products. (Until
          # 2026-09-06 ALL mode was picked by `date +%H == 06`, which the
          # delayed scheduler never satisfied anyway.) ALL is manual-only.
          if [ "${{ github.event.inputs.all_products }}" == "true" ]; then
            ARGS="$ARGS --all"
            echo "Running in ALL MODE (manual all_products=true)"
          else
            echo "Running in PENDING MODE (only pending/failed products; cron: ${{ github.event.schedule || 'manual' }})"
          fi

          # Add limit if specified
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi

          # Add dry-run if specified
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Always use residential proxy — datacenter is 100% blocked by Dunnes
          # Cloudflare (verified 2026-04-21: 42/42 URLs returned 403 on datacenter).
          # Manual dispatch can still override with use_residential_proxy=false
          # for debugging, but scheduled runs always use residential.
          if [ "${{ github.event.inputs.use_residential_proxy }}" != "false" ]; then
            ARGS="$ARGS --use-residential-proxy"
            echo "Using RESIDENTIAL proxy (required — datacenter gets 403 on Dunnes)"
          else
            echo "Using DATACENTER proxy (manual override; expect ~100% failure rate)"
          fi

          set -o pipefail
          python apify_dunnes_scraper.py $ARGS 2>&1 | tee apify_dunnes_scraper.log

      - name: 🩺 Validate scrape success
        if: always()
        # Loud-fail health check (MASA-108, extended 2026-06-08 with Apify
        # quota detection after the Tesco 4-day outage). Detects silent
        # ingestion failures like the MASA-106 401-retry outage AND Apify
        # free-tier compute exhaustion (the failure mode that hit Tesco on
        # 2026-06-04, where actor.call() returns "exceed your remaining usage"
        # and the script ships with zero or partial uploads). Hard-fails if:
        #   - log file missing (scraper crashed pre-logging)
        #   - Apify quota exhausted (>= 1 hit on quota pattern)
        #   - "Authentication failed:" > 0 (initial auth fatal)
        #   - TOTAL > 0 and UPLOADS < 5% of TOTAL (silent failure)
        #   - 401-retry-thrashing > 50 (post-MASA-106 helper running hot)
        run: |
          set -u
          LOG="apify_dunnes_scraper.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::Log file $LOG not found — scraper crashed before producing logs."
            exit 1
          fi

          AUTH_FAILS=$(grep -cE "Authentication failed:" "$LOG" || true)
          AUTH_RETRIES=$(grep -cE "401 on .* re-authenticating and retrying" "$LOG" || true)
          QUOTA_ERR=$(grep -cE "exceed your remaining usage|exceeded.*monthly usage|Account is locked|insufficient credits" "$LOG" || true)
          TOTAL=$(grep -E "Total aliases:\s+[0-9]+" "$LOG" | grep -oE "[0-9]+" | tail -1)
          UPLOADS=$(grep -E "Prices uploaded:\s+[0-9]+" "$LOG" | grep -oE "[0-9]+" | tail -1)
          TOTAL=${TOTAL:-0}
          UPLOADS=${UPLOADS:-0}

          echo "::notice::dunnes health: total_aliases=$TOTAL uploads=$UPLOADS auth_fails=$AUTH_FAILS auth_retries=$AUTH_RETRIES quota_err=$QUOTA_ERR"

          FAIL=0
          if [ "$QUOTA_ERR" -gt 0 ]; then
            echo "::error::dunnes: Apify quota/credits exhausted — top up at https://console.apify.com/billing/subscription (APIFY_API_TOKEN account)."
            FAIL=1
          fi
          if [ "$AUTH_FAILS" -gt 0 ]; then
            echo "::error::dunnes: $AUTH_FAILS fatal auth failures detected."
            FAIL=1
          fi
          if [ "$AUTH_RETRIES" -gt 50 ]; then
            echo "::error::dunnes: $AUTH_RETRIES 401-retry events — JWT TTL likely too short, MASA-107 territory."
            FAIL=1
          fi
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(( UPLOADS * 100 / TOTAL ))
            if [ "$UPLOADS" -lt 5 ] || [ "$PCT" -lt 5 ]; then
              echo "::error::dunnes: silent-ingestion alarm — $UPLOADS uploads from $TOTAL aliases (${PCT}%, threshold 5%)."
              FAIL=1
            fi
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✅ dunnes health check passed: $UPLOADS/$TOTAL uploaded, $AUTH_FAILS fatal auth fails, $AUTH_RETRIES re-auth events."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-dunnes-scraper-logs-${{ github.run_number }}
          path: '*.log'
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Apify Dunnes Scraper failed. Check logs for details."
