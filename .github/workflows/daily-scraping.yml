name: Price Scraping (Mon/Thu)

on:
  # All stores (Aldi, SuperValu, Lidl) run 2x per week — Monday + Thursday.
  # Each scrape day has 3 batches (04:17, 06:17, 08:17 UTC), all in retry
  # mode: batch 1 sees every alias as pending, batches 2/3 only the stragglers.
  # Promotions scan: Sundays 08:17 UTC.
  # Cost-capped at 2x/week per request (was 3x Mon/Wed/Fri) — 2026-04-18.
  # Minute 17 (not 00): GitHub's scheduler is most congested on the hour;
  # in late Aug 2026 the :00 crons started 4–11 h late. The run mode is
  # derived from github.event.schedule (scripts/resolve_run_mode.sh), so a
  # late start no longer changes what the run does. If you edit a cron here,
  # keep the day-of-week field (0 = Sunday promotions) in sync with the script
  # and the summary job below.
  schedule:
    - cron: '17 4 * * 1,4'  # Batch 1 — main pass (Mon + Thu)
    - cron: '17 6 * * 1,4'  # Batch 2 — retry (Mon + Thu)
    - cron: '17 8 * * 1,4'  # Batch 3 — retry (Mon + Thu)
    - cron: '17 8 * * 0'    # Weekly promotions scan (Sundays)

  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      max_products:
        description: 'Max products per store'
        required: false
        default: '700'
        type: string
      promotions_mode:
        description: 'Enable promotions mode (captures promotional data)'
        required: false
        default: false
        type: boolean

jobs:
  scrape-prices:
    name: Scrape ${{ matrix.store }}
    runs-on: ubuntu-latest
    
    strategy:
      # Run all stores in parallel
      # NOTE: Dunnes and Tesco removed due to aggressive anti-bot protection
      # (Cloudflare Turnstile and Akamai) that blocks GitHub Actions IPs.
      # These stores can be scraped locally where residential IPs work.
      matrix:
        store: [Aldi, SuperValu, Lidl]

      # Don't cancel other stores if one fails
      fail-fast: false
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 🌐 Install Chrome Browser
        run: |
          # Add Google Chrome repository
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          
          # Update and install Chrome and Xvfb
          sudo apt-get update
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb \
            wget \
            unzip
      
      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔧 Setup Chrome Environment
        run: |
          # Set Chrome binary path for Selenium
          export CHROME_BIN=/usr/bin/google-chrome
          echo "CHROME_BIN=/usr/bin/google-chrome" >> $GITHUB_ENV
          
          # Get Chrome version
          CHROME_VERSION=$(google-chrome --version | sed 's/Google Chrome //' | cut -d'.' -f1-3)
          echo "Chrome version: $CHROME_VERSION"
          
          # Use Chrome for Testing ChromeDriver (more reliable for CI)
          echo "Installing ChromeDriver via webdriver-manager..."
          pip install webdriver-manager
          
          # Use dedicated script to avoid YAML multiline issues
          python3 install_chromedriver.py
          
          # Install ChromeDriver to system path
          sudo mv /tmp/chromedriver /usr/local/bin/chromedriver
          
          # Verify installations
          google-chrome --version
          chromedriver --version
          which chromedriver
      
      - name: 🐛 Debug Environment
        run: |
          echo "🔍 Environment Debug Information"
          echo "================================"
          google-chrome --version
          chromedriver --version
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          echo "CHROME_BIN: $CHROME_BIN"
          echo "DISPLAY: $DISPLAY"
          echo "Available display processes:"
          ps aux | grep -i xvfb || echo "No Xvfb processes found"
          echo "Environment variables:"
          env | grep -E "(CHROME|DISPLAY|API)" || echo "No relevant env vars found"
      
      - name: 🛒 Scrape ${{ matrix.store }} Prices
        env:
          # API Configuration
          API_URL: ${{ secrets.API_URL }}
          SCRAPER_USERNAME: ${{ secrets.SCRAPER_USERNAME }}
          SCRAPER_PASSWORD: ${{ secrets.SCRAPER_PASSWORD }}
          
          # Chrome Configuration
          CHROME_BIN: /usr/bin/google-chrome
          DISPLAY: :99
          
          # Store Configuration
          STORE_NAME: ${{ matrix.store }}
          MAX_PRODUCTS: ${{ github.event.inputs.max_products || '700' }}
          MANUAL_PROMOTIONS_MODE: ${{ github.event.inputs.promotions_mode || 'false' }}
          CRON_SCHEDULE: ${{ github.event.schedule }}

          # Country Configuration (for multi-country scraping)
          SCRAPER_COUNTRY: 'IE'
          SCRAPER_CURRENCY: 'EUR'
        
        run: |
          echo "🏪 Starting ${{ matrix.store }} scraping..."
          echo "📊 Max products: $MAX_PRODUCTS"
          echo "🕐 Started at: $(date)"

          # Mode comes from the cron that fired (github.event.schedule), not
          # from the clock: GitHub delays these crons by hours, so `date`-based
          # checks picked the wrong mode. See scripts/resolve_run_mode.sh.
          RUN_TYPE=$(bash scripts/resolve_run_mode.sh "$GITHUB_EVENT_NAME" "$CRON_SCHEDULE" "$MANUAL_PROMOTIONS_MODE")
          if [ "$RUN_TYPE" = "promotions" ]; then
            echo "🎯 PROMOTIONS MODE: weekly promotions scan (trigger: $GITHUB_EVENT_NAME, cron: ${CRON_SCHEDULE:-manual})"
            EXTRA_FLAGS="--promotions-mode"
          else
            echo "🔄 RETRY MODE: products not yet scraped today (trigger: $GITHUB_EVENT_NAME, cron: ${CRON_SCHEDULE:-manual})"
            EXTRA_FLAGS="--retry-mode"
          fi

          # Expose RUN_TYPE to the validation step so it can relax the
          # silent-ingestion check on retry-mode no-op runs (MASA-147).
          echo "RUN_TYPE=$RUN_TYPE" >> "$GITHUB_ENV"

          # Start virtual display for headless Chrome
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &

          # Run the scraper with appropriate mode.
          # tee output to a log file so the validation step (and artifact upload)
          # can grep for auth-failure patterns and upload counts. Selenium scraper
          # uses logging.basicConfig (stderr only); without `2>&1 | tee` no log
          # file exists for post-run validation.
          set -o pipefail
          python simple_local_to_prod.py \
            --store "$STORE_NAME" \
            --products "$MAX_PRODUCTS" \
            $EXTRA_FLAGS 2>&1 | tee "scrape_${STORE_NAME}.log"

          echo "✅ ${{ matrix.store }} scraping ($RUN_TYPE mode) completed at: $(date)"

      - name: 🩺 Validate scrape success (${{ matrix.store }})
        if: always()
        env:
          STORE_NAME: ${{ matrix.store }}
          RUN_TYPE: ${{ env.RUN_TYPE }}
        # Delegates to scripts/validate_scrape_log.sh so the same regex/threshold
        # logic is covered by tests/test_validate_scrape_log.py (MASA-159). See
        # the script header for full rationale (MASA-106/108/147 history).
        run: |
          RUN_TYPE_ARG="${RUN_TYPE:-retry}"
          bash scripts/validate_scrape_log.sh \
            "scrape_${STORE_NAME}.log" \
            "$RUN_TYPE_ARG" \
            "$STORE_NAME"

      - name: 📊 Upload Results Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraping-logs-${{ matrix.store }}-${{ github.run_number }}
          path: |
            *.log
            logs/
          retention-days: 7

  # Summary job that runs after all stores complete
  scraping-summary:
    name: Scraping Summary
    needs: scrape-prices
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📊 Generate Summary
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "🎯 Scraping Summary - $(date -u)"
          echo "=================================="
          echo "Trigger: ${{ github.event_name }} (cron: ${CRON_SCHEDULE:-manual})"
          # Keep these cases in sync with the schedule block at the top.
          case "$CRON_SCHEDULE" in
            "17 8 * * 0")   echo "Run: weekly promotions scan (Sunday)" ;;
            "17 4 * * 1,4") echo "Run: batch 1 of 3 — main pass in retry mode (every alias is pending at day start)" ;;
            "17 6 * * 1,4") echo "Run: batch 2 of 3 — retry of batch-1 failures" ;;
            "17 8 * * 1,4") echo "Run: batch 3 of 3 — final retry" ;;
            *)              echo "Run: manual dispatch" ;;
          esac
          echo "Stores: Aldi, SuperValu, Lidl (Tesco and Dunnes run in the Apify workflows)"
          echo ""
          if [[ "${{ needs.scrape-prices.result }}" == "success" ]]; then
            echo "✅ All stores completed successfully"
          elif [[ "${{ needs.scrape-prices.result }}" == "failure" ]]; then
            echo "❌ Some stores failed - check individual job logs"
          else
            echo "⚠️ Mixed results - check individual job logs"
          fi
          echo ""
          echo "🔗 Check results at: https://www.mastermarketapp.com/products"
      
      - name: 🚨 Notify on Failure
        if: needs.scrape-prices.result == 'failure'
        run: |
          echo "⚠️ SCRAPING FAILURE DETECTED"
          echo "Please check the individual job logs for details."
          echo "Common causes:"
          echo "• API authentication issues"
          echo "• Website anti-bot measures"
          echo "• Network connectivity problems"
          echo "• Chrome/Selenium configuration issues"
          echo ""
          echo "🔧 Troubleshooting:"
          echo "• Verify GitHub Secrets are set correctly"
          echo "• Check MasterMarket API status"
          echo "• Review individual store job logs"
          echo "• Consider manual re-run if temporary issue"