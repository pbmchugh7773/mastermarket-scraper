name: Keepalive (prevent scheduled-workflow auto-disable)

# GitHub disables every scheduled workflow in a repository after 60 days
# without activity, silently. It happened to this repo once already (all
# four scrapers went dark; a clean run list looked like "nothing to fix").
#
# This job re-enables every workflow file through the Actions API on the 1st
# and 15th of each month, which counts as workflow activity. It needs no
# commits and touches nothing else. Regular merges remain the real safeguard:
# if you see the "scheduled workflow disabled" email despite this, re-enable
# manually (Actions → workflow → Enable) and check this job's run log.

on:
  schedule:
    - cron: '41 3 1,15 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Re-enable scheduled workflows
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Re-enable every workflow in .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            name=$(basename "$f")
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${name}/enable" >/dev/null; then
              echo "enabled: ${name}"
            else
              echo "::warning::could not enable ${name}"
            fi
          done
          echo "Last commit on main: $(git log -1 --format='%ci %h')"
